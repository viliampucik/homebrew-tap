name: release
on:
  schedule: [{ cron: "0 6 * * *" }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  release:
    runs-on: macos-latest
    env: { GH_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v6
      - id: v
        run: |
          TAG=$(gh release view -R lwouis/alt-tab-macos --json tagName -q .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - if: ${{ !steps.v.outputs.skip }}
        env: { CERT: "${{ secrets.CERT_P12 }}", CERT_PW: "${{ secrets.CERT_PW }}", TAG: "${{ steps.v.outputs.tag }}" }
        run: |
          set -euo pipefail
          V=${TAG#v}
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          git clone -q --depth 1 -b "$TAG" https://github.com/lwouis/alt-tab-macos src
          git -C src apply ../patches/local.patch

          # stable self-signed identity "Local Self-Signed" => macOS permissions survive upgrades
          echo "$CERT" | base64 -d > c.p12
          security create-keychain -p x build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p x build.keychain
          security import c.p12 -k build.keychain -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k x build.keychain >/dev/null

          cat > src/config/local.xcconfig <<XC
          CODE_SIGN_IDENTITY = Local Self-Signed
          DEVELOPMENT_TEAM =
          CODE_SIGN_STYLE = Manual
          OTHER_CODE_SIGN_FLAGS = --deep
          CURRENT_PROJECT_VERSION = $V
          XC
          xcodebuild -project src/alt-tab-macos.xcodeproj -scheme Release -derivedDataPath dd -quiet
          codesign -dv dd/Build/Products/Release/AltTab.app

          ditto -c -k --keepParent dd/Build/Products/Release/AltTab.app "AltTab-$V.zip"
          gh release create "$TAG" "AltTab-$V.zip" --title "AltTab $V (patched)" --notes "Upstream $TAG + patches/local.patch"
          SHA=$(shasum -a 256 "AltTab-$V.zip" | cut -d' ' -f1)
          sed -i '' -e "s/^  version \".*\"/  version \"$V\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/alt-tab-patched.rb
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -am "alt-tab-patched $V"
          git push
